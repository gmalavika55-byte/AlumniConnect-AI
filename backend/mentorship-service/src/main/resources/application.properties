server.port=8102
spring.application.name=mentorship-service

# MySQL / TiDB DB Config
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/alumniconnect}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate/JPA Config
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Auth service base URL for user lookups
auth-service.url=${AUTH_SERVICE_URL:http://auth-service:8101}

# Python AI Service URL
ai.service.url=${AI_SERVICE_URL:http://ai-service:8000}

# 8x8 JaaS Configuration (Environment variables with safe defaults)
jaas.app-id=${JAAS_APP_ID:vpaas-magic-cookie-alumniconnect}
jaas.key-id=${JAAS_KEY_ID:k_alumniconnect}
jaas.private-key=${JAAS_PRIVATE_KEY:}
