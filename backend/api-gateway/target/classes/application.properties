server.port=8080

# =========================
# CORS Configuration
# =========================

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80,http://localhost}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*

spring.cloud.gateway.default-filters[0]=DeduplicateResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_FIRST

# =========================
# Service Routing
# =========================

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URL:http://auth-service:8101}
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**, /student/**, /alumni/**, /admin/**, /notification/**, /certificate/**

spring.cloud.gateway.routes[1].id=mentorship-service
spring.cloud.gateway.routes[1].uri=${MENTORSHIP_SERVICE_URL:http://mentorship-service:8102}
spring.cloud.gateway.routes[1].predicates[0]=Path=/mentorship/**

spring.cloud.gateway.routes[2].id=event-service
spring.cloud.gateway.routes[2].uri=${EVENT_SERVICE_URL:http://event-service:8103}
spring.cloud.gateway.routes[2].predicates[0]=Path=/event/**

spring.cloud.gateway.routes[3].id=fundraising-service
spring.cloud.gateway.routes[3].uri=${FUNDRAISING_SERVICE_URL:http://fundraising-service:8104}
spring.cloud.gateway.routes[3].predicates[0]=Path=/fundraising/**

spring.cloud.gateway.routes[4].id=analytics-service
spring.cloud.gateway.routes[4].uri=${ANALYTICS_SERVICE_URL:http://analytics-service:8105}
spring.cloud.gateway.routes[4].predicates[0]=Path=/career/**, /analytics/**, /career-outcome/**, /placement/**

spring.cloud.gateway.routes[5].id=ai-service
spring.cloud.gateway.routes[5].uri=${AI_SERVICE_URL:http://ai-service:8000}
spring.cloud.gateway.routes[5].predicates[0]=Path=/ai/**

# =========================
# JWT
# =========================

jwt.secret=${JWT_SECRET:secretkey123secretkey123secretkey123secretkey123secretkey123secretkey123}