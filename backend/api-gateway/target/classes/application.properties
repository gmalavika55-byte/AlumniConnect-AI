server.port=8080

# =========================
# CORS Configuration
# =========================

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*

# =========================
# Service Routing
# =========================

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8101
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**, /student/**, /alumni/**, /admin/**, /notification/**, /certificate/**

spring.cloud.gateway.routes[1].id=mentorship-service
spring.cloud.gateway.routes[1].uri=http://localhost:8102
spring.cloud.gateway.routes[1].predicates[0]=Path=/mentorship/**

spring.cloud.gateway.routes[2].id=event-service
spring.cloud.gateway.routes[2].uri=http://localhost:8103
spring.cloud.gateway.routes[2].predicates[0]=Path=/event/**

spring.cloud.gateway.routes[3].id=fundraising-service
spring.cloud.gateway.routes[3].uri=http://localhost:8104
spring.cloud.gateway.routes[3].predicates[0]=Path=/fundraising/**

spring.cloud.gateway.routes[4].id=analytics-service
spring.cloud.gateway.routes[4].uri=http://localhost:8105
spring.cloud.gateway.routes[4].predicates[0]=Path=/career/**, /analytics/**

# =========================
# JWT
# =========================

jwt.secret=secretkey123secretkey123secretkey123secretkey123secretkey123secretkey123