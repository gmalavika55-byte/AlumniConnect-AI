server.port=8104
spring.application.name=fundraising-service

# Oracle DB Config
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/xe
spring.datasource.username=system
spring.datasource.password=a

# Hibernate/JPA Config
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Auth service base URL for donor lookups
auth-service.url=http://localhost:8101

# Razorpay Test Mode Config
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_5173AlumniKCE}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:secret123testKeyRazorpay456}

