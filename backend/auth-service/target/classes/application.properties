server.port=8101
spring.application.name=auth-service

# Oracle Database Connection Properties
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/xe
spring.datasource.username=system
spring.datasource.password=a
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Secret Signature Verification
jwt.secret=secretkey123secretkey123secretkey123secretkey123secretkey123secretkey123

# Spring Mail (Brevo / Gmail SMTP) Config
spring.mail.host=${BREVO_SMTP_HOST:${MAIL_HOST:smtp-relay.brevo.com}}
spring.mail.port=${BREVO_SMTP_PORT:${MAIL_PORT:587}}
spring.mail.username=${BREVO_SMTP_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${BREVO_SMTP_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.from=${BREVO_SMTP_FROM:${spring.mail.username:noreply@alumniconnect.com}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
