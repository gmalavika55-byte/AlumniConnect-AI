server.port=8101
spring.application.name=auth-service

# MySQL / TiDB Database Connection Properties
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/alumniconnect}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Multipart Upload Limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Secret Signature Verification
jwt.secret=${JWT_SECRET:secretkey123secretkey123secretkey123secretkey123secretkey123secretkey123}

# Spring Mail (Brevo / Gmail SMTP) Config
spring.mail.host=${BREVO_SMTP_HOST:${MAIL_HOST:smtp-relay.brevo.com}}
spring.mail.port=${BREVO_SMTP_PORT:${MAIL_PORT:587}}
spring.mail.username=${BREVO_SMTP_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${BREVO_SMTP_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.from=${BREVO_SMTP_FROM:${spring.mail.username:noreply@alumniconnect.com}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
